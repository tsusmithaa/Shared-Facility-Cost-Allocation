
spring.application.name=facility-api-gateway
server.port=8090

# Eureka service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Invoice service route
spring.cloud.gateway.server.webflux.routes[0].id=invoice-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://INVOICE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/invoices/**

# Usage service route
spring.cloud.gateway.server.webflux.routes[1].id=usage-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USAGE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/usage/**

# Allocation service route
spring.cloud.gateway.server.webflux.routes[2].id=allocation-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ALLOCATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/allocations/**

# Workflow service route
spring.cloud.gateway.server.webflux.routes[3].id=workflow-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://WORKFLOW-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/workflows/**

# Disable automatic routes
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Debug logging
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.cloud.gateway=DEBUG
